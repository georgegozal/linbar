<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinBar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="start-menu app-drawer" id="startMenu" aria-label="Applications" hidden>
    <div class="drawer-body">
      <aside class="drawer-sidebar">
        <div class="drawer-user" id="drawerUser">
          <span class="drawer-user-avatar" id="drawerUserAvatar" aria-hidden="true">?</span>
          <span class="drawer-user-name" id="drawerUserName">User</span>
        </div>
        <div class="drawer-cats" id="drawerCats" role="tablist"></div>
        <div class="drawer-actions">
          <button type="button" class="drawer-action" id="drawerTerminal" title="Open Terminal">
            <span class="drawer-action-ico cat-ico-terminal" aria-hidden="true"></span>
            <span>Terminal</span>
          </button>
          <button type="button" class="drawer-action" id="drawerPower" title="Power options">
            <span class="drawer-action-ico cat-ico-power" aria-hidden="true"></span>
            <span>Power</span>
          </button>
        </div>
      </aside>
      <div class="drawer-main">
        <div class="drawer-head">
          <input type="search" id="drawerSearch" placeholder="Search applications…" autocomplete="off" spellcheck="false" />
          <div class="drawer-view-toggle" role="group" aria-label="Application list view">
            <button type="button" class="drawer-view-btn selected" id="drawerViewIcons" title="Icon view" aria-label="Icon view" aria-pressed="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>
            </button>
            <button type="button" class="drawer-view-btn" id="drawerViewList" title="List view" aria-label="List view" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M8 6h13M8 12h13M8 18h13"/>
                <circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/>
                <circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/>
                <circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="drawer-grid drawer-view-icons" id="drawerGrid" role="menu"></div>
      </div>
    </div>
  </div>

  <div class="clip-pop" id="clipPop" hidden>
    <div class="clip-title">Clipboard history</div>
    <div class="clip-list" id="clipList"></div>
  </div>

  <div class="vol-pop" id="volPop" hidden>
    <div class="vol-row">
      <input type="range" id="volSlider" min="0" max="100" step="1" aria-label="Output volume" />
      <span class="vol-level" id="volLevel">—</span>
    </div>
    <button type="button" id="volMuteBtn">Mute</button>
  </div>

  <div class="calendar-pop" id="calendarPop" hidden>
    <div class="cal-head">
      <button type="button" id="calPrev" aria-label="Previous month">&#8249;</button>
      <span id="calTitle"></span>
      <button type="button" id="calNext" aria-label="Next month">&#8250;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="panel-wrap">
    <div class="panel" role="toolbar" aria-label="LinBar taskbar">
      <div class="panel-left">
        <button type="button" class="start-btn" id="startBtn" title="Menu" aria-haspopup="true" aria-expanded="false">m</button>
        <span class="vsep" role="presentation"></span>

        <div class="ql-list" id="quickLaunch" aria-label="Pinned launchers"></div>
        <button type="button" class="icon-btn js-ql" title="Documents" data-action="special" data-arg="documents" aria-label="Documents">
          <span class="ql-icon ql-files"></span>
        </button>

        <span class="vsep" role="presentation"></span>

        <div class="task-list" id="taskList" aria-live="polite"></div>
      </div>

      <div class="panel-spacer"></div>

      <div class="panel-right">
        <button type="button" class="tray-btn" id="trayAbout" title="About This Mac" aria-label="About This Mac">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M12 16v-5M12 8h.01" stroke-linecap="round" fill="none"/>
          </svg>
        </button>
        <button type="button" class="tray-btn" id="trayNotif" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
        </button>
        <button type="button" class="tray-btn" id="trayClip" title="Clipboard preview" aria-label="Clipboard preview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <path d="M9 11h6M9 15h6"/>
          </svg>
        </button>
        <button type="button" class="tray-btn tray-btn--batt" id="trayBatt" title="Battery" aria-label="Battery" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="2" y="7" width="17" height="10" rx="2"/>
            <path d="M22 11v2"/>
            <rect class="batt-fill" x="4.5" y="9.5" width="6" height="5" rx="0.5" fill="currentColor" stroke="none"/>
            <path class="batt-bolt" d="M12.5 5.5L8 13h3.2l-1.2 5.5L15.5 11h-3.3l1.8-5.5z"/>
          </svg>
          <span class="batt-pct" id="battPct"></span>
        </button>
        <button type="button" class="tray-btn tray-btn--vol" id="trayVol" title="Volume" aria-label="Volume">
          <svg id="trayVolIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M11 5L6 9H2v6h4l5 4z"/>
            <path class="vol-waves" d="M19 9a7 7 0 010 6M15.54 11.54a3 3 0 010 3"/>
            <path class="vol-x" d="M16 9l6 6M22 9l-6 6"/>
          </svg>
        </button>

        <div class="clock" id="clock" title="Clock">
          <span class="clock-time" id="clockTime">00:00</span>
          <span class="clock-date" id="clockDate">—</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
