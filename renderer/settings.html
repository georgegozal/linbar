<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinBar Preferences</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 18px 20px 16px;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
    }
    .lead {
      margin: 0 0 16px;
      color: #666;
      font-size: 12px;
    }
    fieldset {
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      margin: 0 0 14px;
      padding: 12px 14px 10px;
      background: #fff;
    }
    legend {
      padding: 0 4px;
      font-weight: 600;
    }
    label.row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      cursor: pointer;
    }
    button.linkish {
      margin-top: 8px;
      border: none;
      background: none;
      color: #0066cc;
      padding: 0;
      font: inherit;
      cursor: pointer;
    }
    .note {
      margin: 0;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>LinBar Preferences</h1>
  <p class="lead">More panel options will arrive in a future update.</p>

  <fieldset>
    <legend>General</legend>
    <label class="row">
      <input type="checkbox" id="launchAtLogin" />
      Open LinBar at login
    </label>
    <label class="row">
      <input type="checkbox" id="hideDockIcon" />
      Hide LinBar icon in the Dock (menu-bar icon remains)
    </label>
  </fieldset>

  <fieldset>
    <legend>Permissions</legend>
    <p class="note">LinBar needs Accessibility access to track and control windows.</p>
    <button type="button" class="linkish" id="openAccessibility">Open Accessibility Settings…</button>
  </fieldset>

  <script src="settings.js"></script>
</body>
</html>
