<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinBar Preferences</title>
  <style>
    :root {
      color-scheme: light;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 18px 20px 16px;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
    }
    .lead {
      margin: 0 0 16px;
      color: #666;
      font-size: 12px;
    }
    fieldset {
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      margin: 0 0 14px;
      padding: 12px 14px 10px;
      background: #fff;
    }
    legend {
      padding: 0 4px;
      font-weight: 600;
    }
    label.row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      cursor: pointer;
    }
    label.row.select-row {
      justify-content: space-between;
      cursor: default;
    }
    label.row.select-row select {
      min-width: 220px;
      font: inherit;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #c7c7cc;
      background-color: #fff;
      color: #1d1d1f;
      -webkit-appearance: menulist;
      appearance: auto;
    }
    label.row.select-row select option {
      color: #1d1d1f;
      background-color: #fff;
    }
    label.row.select-row.disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    button.linkish {
      margin-top: 8px;
      border: none;
      background: none;
      color: #0066cc;
      padding: 0;
      font: inherit;
      cursor: pointer;
    }
    .note {
      margin: 0;
      font-size: 11px;
      color: #888;
    }
    .preview {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #f2f2f7;
      color: #333;
      font-variant-numeric: tabular-nums;
    }
    .preview-time {
      font-weight: 700;
      font-size: 14px;
    }
    .preview-date {
      margin-top: 2px;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>LinBar Preferences</h1>
  <p class="lead">Taskbar appearance and system integration.</p>

  <fieldset>
    <legend>Clock</legend>
    <label class="row">
      <input type="checkbox" id="clockShowDate" />
      Show date below the time
    </label>
    <label class="row select-row">
      <span>Time format</span>
      <select id="clockHour12">
        <option value="24">24-hour (16:00)</option>
        <option value="12">12-hour (4:00 PM)</option>
      </select>
    </label>
    <label class="row select-row" id="clockDateFormatRow">
      <span>Date format</span>
      <select id="clockDateFormat">
        <optgroup label="Month first">
          <option value="long">Tuesday, June 16, 2026</option>
          <option value="medium">Jun 16, 2026</option>
          <option value="short">6/16/26</option>
          <option value="weekdayDate">Tuesday, June 16</option>
        </optgroup>
        <optgroup label="Day first">
          <option value="dmyNumeric">16/06/2026</option>
          <option value="dmyDots">16.06.2026</option>
          <option value="dmyShort">16 Jun 2026</option>
          <option value="dmyLong">16 June 2026</option>
          <option value="dmyWeekday">Tuesday, 16 June 2026</option>
        </optgroup>
        <optgroup label="Other">
          <option value="iso">2026-06-16</option>
        </optgroup>
      </select>
    </label>
    <p class="note preview" id="clockPreview" aria-live="polite"></p>
  </fieldset>

  <fieldset>
    <legend>General</legend>
    <label class="row">
      <input type="checkbox" id="launchAtLogin" />
      Open LinBar at login
    </label>
    <label class="row">
      <input type="checkbox" id="hideDockIcon" />
      Hide LinBar icon in the Dock (menu-bar icon remains)
    </label>
    <label class="row">
      <input type="checkbox" id="reserveScreenSpace" />
      Reserve space for the taskbar (apps tile above it, like the Dock)
    </label>
  </fieldset>

  <fieldset>
    <legend>Permissions</legend>
    <p class="note">LinBar needs Accessibility access to track and control windows.</p>
    <button type="button" class="linkish" id="openAccessibility">Open Accessibility Settings…</button>
  </fieldset>

  <script src="clock-format.js"></script>
  <script src="settings.js"></script>
</body>
</html>
