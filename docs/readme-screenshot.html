<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LinBar README screenshot</title>
  <link rel="stylesheet" href="../renderer/styles.css" />
  <style>
    /* Fixture mirrors renderer/app.js: CAT_ORDER + CATEGORY_META categories. */
    html, body {
      width: 1280px;
      height: 780px;
      background: linear-gradient(165deg, #1a3a5c 0%, #4a7ab0 35%, #87b5de 70%, #c9dde8 100%) !important;
    }
    .desktop-hint {
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.28);
      font-size: 13px;
      user-select: none;
      pointer-events: none;
    }
    .task-btn { animation: none; }
    .ql-list .icon-btn { animation: none; }
    .start-btn.menu-open {
      filter: brightness(0.92);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25), 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    #trayBatt { display: flex !important; }
    .batt-pct::after { content: "78%"; font-size: 10px; margin-left: 2px; }
    .clock-time::before { content: "15:42"; }
    .clock-time { font-size: 0; }
    .vol-waves { opacity: 1; }
    /* Same as runtime: ql-icon / drawer-ico / task-ico use background-image from app icons. */
    .pin-btn .ql-icon.ql-app {
      background: transparent center/contain no-repeat;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    .drawer-ico,
    .task-ico {
      background-color: transparent;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    .drawer-ico { border-radius: 10px; }
    .task-ico { border-radius: 2px; }
  </style>
</head>
<body>
  <div class="desktop-hint" aria-hidden="true">LinBar — app drawer (Whisker-menu style)</div>

  <!-- Open app drawer (same DOM/CSS as renderer/index.html + app.js categories) -->
  <div class="start-menu app-drawer" id="startMenu" aria-label="Applications">
    <div class="drawer-body">
      <aside class="drawer-sidebar">
        <div class="drawer-user">
          <span class="drawer-user-avatar" aria-hidden="true">G</span>
          <span class="drawer-user-name">George</span>
        </div>
        <div class="drawer-cats" role="tablist">
          <button type="button" class="drawer-cat selected" tabindex="-1">
            <span class="drawer-cat-ico cat-ico-all" aria-hidden="true"></span>
            <span class="drawer-cat-label">All Applications</span>
          </button>
          <button type="button" class="drawer-cat" tabindex="-1">
            <span class="drawer-cat-ico cat-ico-internet" aria-hidden="true"></span>
            <span class="drawer-cat-label">Internet</span>
          </button>
          <button type="button" class="drawer-cat" tabindex="-1">
            <span class="drawer-cat-ico cat-ico-development" aria-hidden="true"></span>
            <span class="drawer-cat-label">Development</span>
          </button>
          <button type="button" class="drawer-cat" tabindex="-1">
            <span class="drawer-cat-ico cat-ico-office" aria-hidden="true"></span>
            <span class="drawer-cat-label">Office</span>
          </button>
          <button type="button" class="drawer-cat" tabindex="-1">
            <span class="drawer-cat-ico cat-ico-multimedia" aria-hidden="true"></span>
            <span class="drawer-cat-label">Sound &amp; Video</span>
          </button>
          <button type="button" class="drawer-cat" tabindex="-1">
            <span class="drawer-cat-ico cat-ico-graphics" aria-hidden="true"></span>
            <span class="drawer-cat-label">Graphics</span>
          </button>
          <button type="button" class="drawer-cat" tabindex="-1">
            <span class="drawer-cat-ico cat-ico-system" aria-hidden="true"></span>
            <span class="drawer-cat-label">System Tools</span>
          </button>
          <button type="button" class="drawer-cat" tabindex="-1">
            <span class="drawer-cat-ico cat-ico-accessories" aria-hidden="true"></span>
            <span class="drawer-cat-label">Accessories</span>
          </button>
        </div>
        <div class="drawer-actions">
          <button type="button" class="drawer-action" tabindex="-1">
            <span class="drawer-action-ico cat-ico-terminal" aria-hidden="true"></span>
            <span>Terminal</span>
          </button>
          <button type="button" class="drawer-action" tabindex="-1">
            <span class="drawer-action-ico cat-ico-power" aria-hidden="true"></span>
            <span>Power</span>
          </button>
        </div>
      </aside>
      <div class="drawer-main">
        <div class="drawer-head">
          <input type="search" value="" placeholder="Search applications…" readonly tabindex="-1" />
          <div class="drawer-view-toggle" role="group" aria-label="Application list view">
            <button type="button" class="drawer-view-btn selected" tabindex="-1" aria-pressed="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>
            </button>
            <button type="button" class="drawer-view-btn" tabindex="-1" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M8 6h13M8 12h13M8 18h13"/>
                <circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/>
                <circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/>
                <circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="drawer-grid drawer-view-icons" role="menu">
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/firefox.png');"></span>
            <span class="drawer-label">Firefox</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/safari.png');"></span>
            <span class="drawer-label">Safari</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/terminal.png');"></span>
            <span class="drawer-label">Terminal</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/vscode.png');"></span>
            <span class="drawer-label">Visual Studio Code</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/textedit.png');"></span>
            <span class="drawer-label">TextEdit</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/preview.png');"></span>
            <span class="drawer-label">Preview</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/calculator.png');"></span>
            <span class="drawer-label">Calculator</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/music.png');"></span>
            <span class="drawer-label">Music</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/mail.png');"></span>
            <span class="drawer-label">Mail</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/notes.png');"></span>
            <span class="drawer-label">Notes</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/finder.png');"></span>
            <span class="drawer-label">Finder</span>
          </button>
          <button type="button" class="drawer-item" tabindex="-1">
            <span class="drawer-ico" style="background-image: url('../assets/readme-icons/activity-monitor.png');"></span>
            <span class="drawer-label">Activity Monitor</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-wrap">
    <div class="panel" role="img" aria-label="LinBar taskbar preview">
      <div class="panel-left">
        <button type="button" class="start-btn menu-open" tabindex="-1" aria-expanded="true">m</button>
        <span class="vsep"></span>
        <div class="ql-list" aria-label="Pinned launchers">
          <button type="button" class="icon-btn pin-btn" tabindex="-1" title="Firefox">
            <span class="ql-icon ql-app" style="background-image: url('../assets/readme-icons/firefox.png');"></span>
          </button>
          <button type="button" class="icon-btn pin-btn" tabindex="-1" title="Finder">
            <span class="ql-icon ql-app" style="background-image: url('../assets/readme-icons/finder.png');"></span>
          </button>
          <button type="button" class="icon-btn pin-btn" tabindex="-1" title="Visual Studio Code">
            <span class="ql-icon ql-app" style="background-image: url('../assets/readme-icons/vscode.png');"></span>
          </button>
        </div>
        <span class="vsep"></span>
        <div class="task-list">
          <button type="button" class="task-btn active">
            <span class="task-ico" style="background-image: url('../assets/readme-icons/vscode.png');"></span>
            <span class="task-label">README.md — linbar</span>
          </button>
          <button type="button" class="task-btn">
            <span class="task-ico" style="background-image: url('../assets/readme-icons/finder.png');"></span>
            <span class="task-label">Finder</span>
          </button>
        </div>
      </div>
      <div class="panel-spacer"></div>
      <div class="panel-right">
        <button type="button" class="tray-btn" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </button>
        <button type="button" class="tray-btn" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <button type="button" class="tray-btn" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        </button>
        <button type="button" class="tray-btn tray-btn--batt" id="trayBatt" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/><rect x="4.5" y="9.5" width="6" height="5" rx="0.5" fill="currentColor" stroke="none"/></svg>
          <span class="batt-pct"></span>
        </button>
        <button type="button" class="tray-btn tray-btn--vol" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M11 5L6 9H2v6h4l5 4z"/><path class="vol-waves" d="M19 9a7 7 0 010 6M15.54 11.54a3 3 0 010 3"/></svg>
        </button>
        <div class="clock clock--time-only"><span class="clock-time">00:00</span></div>
        <button type="button" class="tray-btn show-desktop-btn" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 15h18"/></svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
