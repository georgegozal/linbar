<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LinBar README screenshot</title>
  <link rel="stylesheet" href="../renderer/styles.css" />
  <style>
    html, body {
      width: 1280px;
      height: 720px;
      background: linear-gradient(165deg, #1a3a5c 0%, #4a7ab0 35%, #87b5de 70%, #c9dde8 100%) !important;
    }
    .desktop-hint {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      bottom: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.35);
      font-size: 15px;
      letter-spacing: 0.04em;
      user-select: none;
      pointer-events: none;
    }
    .task-btn { animation: none; }
    .ql-list .icon-btn { animation: none; }
    #trayBatt { display: flex !important; }
    .batt-pct::after { content: "78%"; font-size: 10px; margin-left: 2px; }
    .clock-time::before { content: "15:42"; }
    .clock-time { font-size: 0; }
    .vol-waves, .vol-x { opacity: 1; }
    .vol-x { opacity: 0; }
  </style>
</head>
<body>
  <div class="desktop-hint" aria-hidden="true">macOS desktop (LinBar sits on the bottom edge)</div>

  <div class="panel-wrap">
    <div class="panel" role="img" aria-label="LinBar taskbar preview">
      <div class="panel-left">
        <button type="button" class="start-btn" tabindex="-1">m</button>
        <span class="vsep"></span>
        <div class="ql-list">
          <button type="button" class="icon-btn ql-app ql-firefox" title="Firefox"></button>
          <button type="button" class="icon-btn ql-app ql-files" title="Files"></button>
          <button type="button" class="icon-btn ql-app ql-term" title="Terminal"></button>
        </div>
        <span class="vsep"></span>
        <div class="task-list">
          <button type="button" class="task-btn active">
            <span class="task-ico" style="background: linear-gradient(135deg,#555,#222);"></span>
            <span class="task-label">README.md — linbar</span>
          </button>
          <button type="button" class="task-btn">
            <span class="task-ico" style="background: linear-gradient(135deg,#3b82f6,#1d4ed8);"></span>
            <span class="task-label">GitHub — LinBar</span>
          </button>
          <button type="button" class="task-btn minimized">
            <span class="task-ico" style="background: linear-gradient(135deg,#f97316,#ea580c);"></span>
            <span class="task-label">Firefox — LinBar releases</span>
          </button>
        </div>
      </div>
      <div class="panel-spacer"></div>
      <div class="panel-right">
        <button type="button" class="tray-btn" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </button>
        <button type="button" class="tray-btn" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <button type="button" class="tray-btn" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        </button>
        <button type="button" class="tray-btn tray-btn--batt" id="trayBatt" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/><rect x="4.5" y="9.5" width="6" height="5" rx="0.5" fill="currentColor" stroke="none"/></svg>
          <span class="batt-pct"></span>
        </button>
        <button type="button" class="tray-btn tray-btn--vol" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M11 5L6 9H2v6h4l5 4z"/><path class="vol-waves" d="M19 9a7 7 0 010 6M15.54 11.54a3 3 0 010 3"/></svg>
        </button>
        <div class="clock clock--time-only" id="clock"><span class="clock-time">00:00</span></div>
        <button type="button" class="tray-btn show-desktop-btn" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 15h18"/></svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
